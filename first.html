<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>不会有人打不开电脑吧</title>
    <style>
        body {
            margin: 0;
            background-color: #e3e1dd;
            display: block; 
        }
        /* 下面是解密内容 */
        .game-stage {
            position: relative;    /* 允许内部的文本进行绝对定位 */
            width: 100%;           /* 宽度撑满 */
            height: auto;
        }

        /* 2. 背景图片本身 */
        .bg-image {
            width: 100%;           
            height: auto;         
            display: block;
        }

        /* 3. 文本样式 */
        .butterfly-text {
            position: absolute;    /* 相对于 game-stage 容器绝对定位 */
            color: #000000;   
            font-size: 1.5vw;      
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            white-space: nowrap;   

            /* 【核心技术2】使用百分比定位 */
            left: var(--x,50%);           
            top: var(--y,50%);             
            
            /* 【核心技术3】以文字自身的中心点对齐 */
            transform: translate(-50%, -50%); 
        }
        /* 2. 【核心魔法】：当鼠标放上去时 (:hover) 发生的变化 */
        .butterfly-text:hover {
            /* 颜色会变成我们在 HTML 标签里通过 --hover-color 定义的颜色 */
            color: var(--hover-color, #ff0000); 
        }

        /* 3. 【核心魔法】：用伪元素来动态改变文字内容 */
        .butterfly-text:hover span {
            display: none;          /* 鼠标放上去时，原本的字隐藏 */
        }

        .butterfly-text:hover::after {
            /* 鼠标放上去时，显示我们在 HTML 标签里通过 data-hover 定义的文字 */
            content: attr(data-hover); 
        }

        /* ==============================
        提交流程容器 (随屏幕缩放并支持变量定位)
        ============================== */
        .game-container {
            position: absolute;
            left: var(--x, 50%);
            top: var(--y, 70%); 
            transform: translate(-50%, -50%); 
            
            text-align: center;
            width: 100%; 
            max-width: 15vw;
        }

        /* 3. 提示文字样式 */
        .tip-text {
            font-size: 1.2vw; /* 调整这个数字来改变初始大小 */
            font-weight: bold;
            margin-bottom: 1vw; 
            letter-spacing: 0.1vw;
            color: #000000; 
        }

        /* 4. 输入框样式 */
        .password-input {
            box-sizing: border-box;
            width: 100%; 
            padding: 0.8vw;
            font-size: 1.2vw;
            background-color: rgb(253, 253, 237);
            border: 0.2vw solid #0b0c10;
            border-radius: 0.5vw;
            color: #0b0c10;
            text-align: center;
            outline: none;
            margin-bottom: 1.2vw;
        }

        /* 5. 提交按键样式 */
        .submit-btn {
            box-sizing: border-box;
            width: 60%; 
            display: block;       
            margin: 0 auto;
            padding: 0.6vw;
            font-size: 1.2vw;
            font-weight: bold;
            background-color: transparent;
            color: #000000;
            border: 0.2vw solid #000000;
            border-radius: 0.5vw;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        /* 提交按键悬停特效 */
        .submit-btn:hover {
            background-color: #66fcf1;
            color: #0b0c10;
            box-shadow: 0 0 1vw #66fcf1;
        }
    </style>
</head>
<body>
    <div class="game-stage">
        <img src="figure/lockscreen.png" alt="游戏背景" class="bg-image">
        
        <div class="butterfly-text" style="--hover-color:#ffea00; --x:34%; --y:30%" data-hover="9"><span>3</span></div>
        <div class="butterfly-text" style="--hover-color:#1d2ba7; --x:66%; --y:30%" data-hover="6"><span>1</span></div>
        <div class="butterfly-text" style="--hover-color:#ff691d; --x:34%; --y:70%" data-hover="1"><span>2</span></div>
        <div class="butterfly-text" style="--hover-color:#25be39; --x:66%; --y:70%" data-hover="0"><span>4</span></div>
    </div>
    <div class="game-container">
        <!-- 文字提示 -->
        <div class="tip-text">请输入登录密码</div>
        
        <!-- 输入框 (id="inputPassword" 方便JS抓取输入内容) -->
        <input type="password" id="inputPassword" class="password-input" placeholder="PASSWORD">
        
        <!-- 提交按键 (onclick 绑定了下面JS的检查函数) -->
        <button class="submit-btn" onclick="checkPassword()">确定</button>
    </div>

    <!-- 6. JavaScript 核心逻辑 -->
    <script>
    var errorCount = 0; // 记录错误次数

    function checkPassword() {
        var userInput = document.getElementById("inputPassword").value;
        
        var correctAnswer = "0619"; 
        
        if (userInput === correctAnswer) {
            window.location.href = "second.html"; 
        } else {
            errorCount++; // 错误次数+1

            if (errorCount === 1) {
                alert("密码就在背景里");
            } else if (errorCount === 2){
                alert("点击数字，注意数字与颜色的对应");
            } else{
                alert("顺序-颜色-密码，龙哥，下次忘了密码直接问我吧")
            }
            
            document.getElementById("inputPassword").value = "";
        }
    }

    document.getElementById("inputPassword").addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            checkPassword();
        }
    });
</script>
</body>
</html>
