
<!DOCTYPE html>
<html>

<head>
<script src="script/app-runtime.js"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AES</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    padding:12px;
    background:#111827;
}

/* 主窗口 */
.aes-box{
    width:100%;
    max-width:450px;
    margin:auto;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(10px);
    border-radius:20px;
    box-shadow:0 0 30px rgba(0,0,0,0.5);
    color:white;
}

.aes-header{
    position:sticky;
    top:0;
    z-index:1;
    display:grid;
    grid-template-columns:44px minmax(0,1fr) 44px;
    align-items:center;
    gap:8px;
    padding:8px 12px;
    background:#1c2433;
    border-bottom:1px solid rgba(255,255,255,0.12);
    border-radius:20px 20px 0 0;
}

.aes-header h2{
    grid-column:2;
    margin:0;
    text-align:center;
}

.aes-content{
    padding:0 clamp(16px, 5vw, 35px) 15px;
}

/* 标签 */

label,
p{

    margin-bottom:8px;

}

/* 输入框 */

textarea,
input,
select{

    width:100%;

    padding:12px;

    margin-bottom:20px;

    font-size:16px;

    border-radius:10px;

    border:none;

    outline:none;

    background:
    rgba(255,255,255,0.9);

}

textarea{

    resize:none;

}

/* 按钮 */

.aes-content button{

    width:100%;

    padding:12px;

    font-size:18px;

    font-weight:bold;

    border:none;

    border-radius:10px;

    cursor:pointer;

    background:#66fcf1;

    color:#111;

    transition:.3s;

}

.aes-content button:hover{

    transform:scale(1.05);

    box-shadow:
    0 0 20px #66fcf1;

}

/* 结果 */

#result{

    background:
    rgba(0,0,0,0.5);

    color:#d1d4d4;

}

/* 退出按钮 */

.exit-btn{
    display:grid;
    place-items:center;
    width:44px;
    height:44px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,0.15);
    color:white;
    font-size:22px;
    line-height:1;
    padding:0;
    cursor:pointer;
    transition:background-color .3s;
}

.exit-btn:hover{
    background:#ff4d4f;
}

.article-card,
input::placeholder{

    color:#999;

    font-style:italic;

}

</style>

</head>

<body>
<div class="aes-box">

<header class="aes-header">
    <h2>AES 小工具</h2>
    <button class="exit-btn" type="button" aria-label="关闭AES，返回空间" onclick="exitGame()">×</button>
</header>

<div class="aes-content">
<h3>
输入
</h3>

<textarea 
id="inputText"
rows="5">
</textarea>

<h3>
Key
</h3>

<input 
id="keyInput"
type="text"
placeholder="请分清虚拟与现实"
>
<h3>
模式
</h3>

<select id="modeSelect">

<option value="encrypt">
加密
</option>

<option value="decrypt">
解密
</option>

</select>

<button onclick="runAES()">

执行

</button>

<h3>
结果
</h3>

<textarea 
id="result"
rows="5"
readonly>
</textarea>

</div>
</div>

<script src="script/crypto-js.min.js"></script>

<script src="script/scriptPartOne.js"></script>

<script>

function runAES(){

    let input =
    document.getElementById("inputText").value;

    let key =
    document.getElementById("keyInput").value;

    let mode =
    document.getElementById("modeSelect").value;

    let result =
    AESProcess(
        input,
        key,
        mode
    );

    document.getElementById("result").value=result;

}

function exitGame(){

    // AES 在独立标签页中运行，关闭后原空间页面仍保留在原标签页。
    window.close();
    setTimeout(()=>{
        if(!window.closed) location.href="second.html?app=qzone";
    },100);

}

</script>

</body>

</html>
