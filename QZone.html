<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <script src="script/app-runtime.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penguin空间</title>
    <link rel="stylesheet" href="style/QQ.css?v=history-top-gap-4">
    <link rel="stylesheet" href="style/QZone.css?v=matching-close-1">
</head>

<body>
    <div class="qzone-window">
        <div class="qzone-header">
            <span>Penguin空间</span>
            <button class="qzone-close" type="button" aria-label="关闭空间">×</button>
        </div>

        <div class="qzone-body">
            <div class="qzone-feed" aria-live="polite">
                <div class="qzone-loading">动态加载中……</div>
            </div>
        </div>

        <div class="qzone-footer">
            <button class="qzone-send-btn" disabled>✎ 发表动态</button>
        </div>
    </div>

    <script src="script/QZone.js?v=qqspace-layout-1"></script>
</body>
</html>
